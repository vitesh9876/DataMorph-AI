<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-label="DataMorph AI colorful processing flow">
<defs>
  <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#c026d3"/></linearGradient>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0891b2"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
  <linearGradient id="d" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
  <linearGradient id="e" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ec4899"/><stop offset="1" stop-color="#db2777"/></linearGradient>
  <linearGradient id="f" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16a34a"/><stop offset="1" stop-color="#65a30d"/></linearGradient>
  <filter id="s" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity=".18"/></filter>
  <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
  <style>
    .t{font:800 19px Arial,sans-serif;fill:#fff}.n{font:800 12px Arial,sans-serif;fill:#fff;opacity:.8;letter-spacing:2px}.s{font:500 12px Arial,sans-serif;fill:#fff;opacity:.92}
    .line{fill:none;stroke:#475569;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#m)}
  </style>
</defs>
<rect x="0" y="0" width="1200" height="720" rx="24" fill="#fff"/>
<!-- main path -->
<path class="line" d="M600 125 V160"/>
<path class="line" d="M600 245 V280"/>
<path class="line" d="M600 365 V405 H300 V450"/>
<path class="line" d="M600 365 V405 H900 V450"/>
<path class="line" d="M300 555 V595 H600 V620"/>
<path class="line" d="M900 555 V595 H600 V620"/>
<!-- animated flow dots -->
<circle r="6" fill="#7c3aed"><animateMotion dur="2.2s" repeatCount="indefinite" path="M600 125 V620"/></circle>
<circle r="6" fill="#06b6d4"><animateMotion dur="2.2s" begin=".8s" repeatCount="indefinite" path="M600 365 V405 H900 V555"/></circle>
<!-- cards -->
<g filter="url(#s)">
  <g transform="translate(375 40)"><rect width="450" height="85" rx="22" fill="url(#a)"/><text class="n" x="225" y="25" text-anchor="middle">01</text><text class="t" x="225" y="52" text-anchor="middle">RAW FILES</text><text class="s" x="225" y="70" text-anchor="middle">PDF • XLSX • DOCX • PPTX • CSV • TXT</text></g>
  <g transform="translate(375 160)"><rect width="450" height="85" rx="22" fill="url(#b)"/><text class="n" x="225" y="25" text-anchor="middle">02</text><text class="t" x="225" y="52" text-anchor="middle">MULTI-FORMAT EXTRACTOR</text><text class="s" x="225" y="70" text-anchor="middle">PyMuPDF • pdfplumber • openpyxl • python-docx</text></g>
  <g transform="translate(375 280)"><rect width="450" height="85" rx="22" fill="url(#c)"/><text class="n" x="225" y="25" text-anchor="middle">03</text><text class="t" x="225" y="52" text-anchor="middle">STRUCTURE + CLEAN</text><text class="s" x="225" y="70" text-anchor="middle">Normalization • deduplication • quality scoring</text></g>
  <g transform="translate(70 450)"><rect width="460" height="105" rx="24" fill="url(#d)"/><text class="n" x="230" y="28" text-anchor="middle">04A</text><text class="t" x="230" y="57" text-anchor="middle">ML ENGINE</text><text class="s" x="230" y="80" text-anchor="middle">Anomaly detection • forecasting</text></g>
  <g transform="translate(670 450)"><rect width="460" height="105" rx="24" fill="url(#e)"/><text class="n" x="230" y="28" text-anchor="middle">04B</text><text class="t" x="230" y="57" text-anchor="middle">GEMINI + NLP</text><text class="s" x="230" y="80" text-anchor="middle">Ask Your Data • natural-language insights</text></g>
  <g transform="translate(375 620)"><rect width="450" height="80" rx="22" fill="url(#f)"/><text class="n" x="225" y="24" text-anchor="middle">05</text><text class="t" x="225" y="51" text-anchor="middle">VISUALIZATION + INSIGHTS</text><text class="s" x="225" y="68" text-anchor="middle">Charts • patterns • explanations</text></g>
</g>
<path class="line" d="M600 700 V735"/>
<g filter="url(#s)">
  <g transform="translate(375 735)">
    <rect width="450" height="65" rx="20" fill="url(#g)"/>
    <text class="n" x="225" y="22" text-anchor="middle">06</text>
    <text class="t" x="225" y="47" text-anchor="middle" font-size="18">REPORT ENGINE</text>
  </g>
</g>
</svg>