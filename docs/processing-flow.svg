<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">DataMorph AI Processing Flow</title>
<desc id="desc">Raw files flow through extraction and cleaning, split into machine learning and Gemini NLP analysis, then merge into visualization and reporting.</desc>
<defs>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0891b2"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
  <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ea580c"/><stop offset="1" stop-color="#f97316"/></linearGradient>
  <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#10b981"/></linearGradient>
  <linearGradient id="g6" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#db2777"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  <linearGradient id="g7" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16a34a"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".16"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
  </marker>
  <style>
    .box{stroke:#fff;stroke-width:3}
    .title{font:800 22px Arial,sans-serif;fill:#fff}
    .sub{font:500 13px Arial,sans-serif;fill:#fff;opacity:.92}
    .num{font:800 13px Arial,sans-serif;fill:#fff;opacity:.8;letter-spacing:1px}
    .arrow{fill:none;stroke:#64748b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
  </style>
</defs>

<rect width="1200" height="820" rx="28" fill="#ffffff"/>
<text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#0f172a">DATAMORPH AI — PROCESSING FLOW</text>
<text x="600" y="74" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#64748b">From raw files to structured insights and reports</text>

<!-- arrows -->
<path class="arrow" d="M600 175 V205"/>
<path class="arrow" d="M600 300 V330"/>
<path class="arrow" d="M600 425 V460 H285 V485"/>
<path class="arrow" d="M600 425 V460 H915 V485"/>
<path class="arrow" d="M285 585 V620 H600 V645"/>
<path class="arrow" d="M915 585 V620 H600 V645"/>
<path class="arrow" d="M600 735 V765"/>

<!-- nodes -->
<g filter="url(#shadow)">
  <g transform="translate(375 100)">
    <rect class="box" width="450" height="75" rx="18" fill="url(#g1)"/>
    <text class="num" x="225" y="24" text-anchor="middle">01</text>
    <text class="title" x="225" y="49" text-anchor="middle">RAW FILES</text>
    <text class="sub" x="225" y="66" text-anchor="middle">PDF • XLSX • DOCX • PPTX • CSV • TXT</text>
  </g>

  <g transform="translate(375 225)">
    <rect class="box" width="450" height="75" rx="18" fill="url(#g2)"/>
    <text class="num" x="225" y="24" text-anchor="middle">02</text>
    <text class="title" x="225" y="49" text-anchor="middle">MULTI-FORMAT EXTRACTOR</text>
    <text class="sub" x="225" y="66" text-anchor="middle">PyMuPDF • pdfplumber • openpyxl • python-docx</text>
  </g>

  <g transform="translate(375 350)">
    <rect class="box" width="450" height="75" rx="18" fill="url(#g3)"/>
    <text class="num" x="225" y="24" text-anchor="middle">03</text>
    <text class="title" x="225" y="49" text-anchor="middle">STRUCTURE + CLEAN</text>
    <text class="sub" x="225" y="66" text-anchor="middle">Normalization • deduplication • quality scoring</text>
  </g>

  <g transform="translate(85 485)">
    <rect class="box" width="400" height="100" rx="20" fill="url(#g4)"/>
    <text class="num" x="200" y="27" text-anchor="middle">04A</text>
    <text class="title" x="200" y="56" text-anchor="middle">ML ENGINE</text>
    <text class="sub" x="200" y="78" text-anchor="middle">Anomaly detection • forecasting</text>
  </g>

  <g transform="translate(715 485)">
    <rect class="box" width="400" height="100" rx="20" fill="url(#g6)"/>
    <text class="num" x="200" y="27" text-anchor="middle">04B</text>
    <text class="title" x="200" y="56" text-anchor="middle">GEMINI + NLP</text>
    <text class="sub" x="200" y="78" text-anchor="middle">Ask Your Data • natural-language insights</text>
  </g>

  <g transform="translate(375 645)">
    <rect class="box" width="450" height="90" rx="20" fill="url(#g5)"/>
    <text class="num" x="225" y="27" text-anchor="middle">05</text>
    <text class="title" x="225" y="55" text-anchor="middle">VISUALIZATION + INSIGHTS</text>
    <text class="sub" x="225" y="76" text-anchor="middle">Charts • patterns • explanations</text>
  </g>

  <g transform="translate(375 765)">
    <rect class="box" width="450" height="48" rx="16" fill="url(#g7)"/>
    <text class="title" x="225" y="31" text-anchor="middle" font-size="18">06 • REPORT ENGINE</text>
  </g>
</g>
</svg>